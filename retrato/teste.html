<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste do retrato</title>
<style>
  :root { --bg: #0c0c0c; --fg: #d7e2ea; --muted: #8a949c; --line: #2a2d31; --accent: #b600a8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; min-height: 100vh;
         display: grid; place-items: center; padding: 24px 16px; }
  main { width: min(640px, 100%); display: grid; gap: 18px; }
  h1 { font-size: 20px; font-weight: 600; }
  p { color: var(--muted); }
  .palco { position: relative; aspect-ratio: 1; width: 100%; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .palco img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity 70ms linear; }
  .controles { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px;
           padding: 8px 16px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  label { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  input[type=range] { flex: 1; accent-color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>Teste do retrato</h1>
  <p>As imagens trocam sozinhas, como no site. Repare se o cabelo, as orelhas ou o contorno "pulam". Só o rosto deveria mudar.</p>
  <div class="palco" id="palco"></div>
  <div class="controles" id="modos"></div>
  <label>Velocidade <input type="range" id="vel" min="150" max="1500" value="600"></label>
</main>
<script>
  // imagens do teste: a mãe primeiro, depois as expressões alinhadas
  const imagens = [
    ['mãe', '2-mae/rest.png'],
    ['desconfiado (alinhado)', '4-alinhadas/desconfiado.png'],
    ['desconfiado (original do ChatGPT)', '3-chatgpt/desconfiado.webp'],
    ['beijo (alinhado)', '4-alinhadas/kiss.png'],
    ['beijo (original do ChatGPT)', '3-chatgpt/kiss.webp'],
    ...'n ne e se s sw w nw'.split(' ').map(d => ['olhar ' + d, '4-alinhadas/olhar-' + d + '.png']),
  ];
  const modos = [
    ['Olhares em círculo', [5, 6, 7, 8, 9, 10, 11, 12]],
    ['Olhares com a mãe no meio', [0, 5, 0, 6, 0, 7, 0, 8, 0, 9, 0, 10, 0, 11, 0, 12]],
    ['Mãe ↔ beijo', [0, 3]],
    ['Mãe ↔ beijo original', [0, 4]],
    ['Mãe ↔ alinhado', [0, 1]],
    ['Mãe ↔ original do ChatGPT', [0, 2]],
    ['Parar na mãe', [0]],
  ];
  const palco = document.getElementById('palco'), vel = document.getElementById('vel');
  const els = imagens.map(([alt, src], i) => {
    const im = new Image(); im.src = src; im.alt = alt; im.style.opacity = i ? 0 : 1; palco.append(im); return im;
  });
  let seq = modos[0][1], passo = 0, timer;
  function mostrar(i) { els.forEach((e, j) => e.style.opacity = j === i ? 1 : 0); }
  function tocar() { clearTimeout(timer); mostrar(seq[passo % seq.length]); passo++; if (seq.length > 1) timer = setTimeout(tocar, +vel.value); }
  const barra = document.getElementById('modos');
  modos.forEach(([nome, s], i) => {
    const b = document.createElement('button'); b.textContent = nome; b.setAttribute('aria-pressed', i === 0);
    b.onclick = () => { barra.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); seq = s; passo = 0; tocar(); };
    barra.append(b);
  });
  vel.oninput = tocar;
  tocar();
</script>
</body>
</html>
